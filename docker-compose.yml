services:
  backend:
    build:
      context: backend
      target: develop
    # allow the developer to examine the api
    ports:
      - "3000:3000"
    environment:
      HITOBITO_TOKEN: ${HITOBITO_TOKEN}
      HITOBITO_URL: ${HITOBITO_URL}
      SWIFT_CONTAINER: ${SWIFT_CONTAINER:-example-container}
      OS_AUTH_URL: ${OS_AUTH_URL:-http://swift:5000/v3} # Needs to use the internal network service name
      OS_USERNAME: ${OS_USERNAME:-swift}
      OS_PASSWORD: ${OS_PASSWORD:-veryfast}
      OS_PROJECT_NAME: ${OS_PROJECT_NAME:-service}
      OS_USER_DOMAIN_NAME: ${OS_USER_DOMAIN_NAME:-Default}
      OS_PROJECT_DOMAIN_NAME: ${OS_PROJECT_DOMAIN_NAME:-Default}
      OS_IDENTITY_API_VERSION: ${OS_IDENTITY_API_VERSION:-3}
      OS_REGION_NAME: ${OS_REGION:-RegionOne}
      ROOT_GROUP: 2
    depends_on:
      swift:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: backend/
          target: /app
    stdin_open: true
    tty: true
  frontend:
    build:
      context: frontend
      target: dev
      args:
        - VITE_BACKEND_URL=${BACKEND_URL:-http://backend:3000}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: frontend/
          target: /usr/src/app
  swift:
    build: ../docker-keystone-swift
    ports:
      - "5000:5000"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://swift:5000"]
      interval: 10s
      timeout: 2s
